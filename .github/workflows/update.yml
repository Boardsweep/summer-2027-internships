name: Update the list
on:
  schedule:
    - cron: "23 */6 * * *"     # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build README, listings.json and stats
        run: python3 scripts/build.py
        env:
          LEVEL: ${{ vars.LEVEL }}
      - name: Commit if anything changed
        run: |
          git config user.name "Boardsweep"
          git config user.email "support@boardsweep.io"
          git add README.md listings.json assets/stats.svg fields
          git diff --cached --quiet || git commit -m "Update the list"
          git push
